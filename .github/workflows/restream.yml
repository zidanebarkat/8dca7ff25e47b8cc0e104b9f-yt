name: YT Restream
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Source URL (YouTube, Twitch, etc.)
        required: true
      output_url:
        description: YouTube RTMP URL
        required: true
      overlay_text:
        description: Overlay text on stream
        required: false
        default: ''
      github_token:
        description: GitHub PAT for self-trigger
        required: false
        default: ''

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -q yt-dlp curl_cffi

      - name: Resolve source
        id: resolve
        run: |
          echo "Resolving: ${{ inputs.source_url }}"
          yt-dlp --impersonate chrome -g --socket-timeout 30 "${{ inputs.source_url }}" > /tmp/yt_urls.txt 2>/tmp/yt_err.txt || true
          cat /tmp/yt_err.txt
          urls=$(cat /tmp/yt_urls.txt)
          if [ -z "$urls" ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: Could not resolve source. URL: ${{ inputs.source_url }}"
            exit 1
          fi
          count=$(echo "$urls" | wc -l)
          if [ "$count" -ge 2 ]; then
            echo "video_url=$(echo "$urls" | head -1)" >> "$GITHUB_OUTPUT"
            echo "audio_url=$(echo "$urls" | sed -n '2p')" >> "$GITHUB_OUTPUT"
            echo "has_separate_audio=true" >> "$GITHUB_OUTPUT"
          else
            echo "video_url=$urls" >> "$GITHUB_OUTPUT"
            echo "audio_url=" >> "$GITHUB_OUTPUT"
            echo "has_separate_audio=false" >> "$GITHUB_OUTPUT"
          fi
          echo "live=true" >> "$GITHUB_OUTPUT"

      - name: Overlay text updater
        if: inputs.overlay_text != ''
        run: |
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          echo "${{ inputs.overlay_text }}" > overlay.txt
          (while true; do
            curl -s "https://strwithgit.pythonanywhere.com/config" | python3 -c "import sys,json; print(json.load(sys.stdin).get('overlay_text',''))" > overlay.txt 2>/dev/null || true
            sleep 10
          done) &

      - name: Schedule self-reboot
        if: inputs.github_token != ''
        run: |
          TRIGGER_WORKFLOW() {
            curl -s -X POST \
              -H "Authorization: Bearer ${{ inputs.github_token }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/restream.yml/dispatches" \
              -d '{"ref":"main","inputs":{
                "source_url":"${{ inputs.source_url }}",
                "output_url":"${{ inputs.output_url }}",
                "overlay_text":"${{ inputs.overlay_text }}",
                "github_token":"${{ inputs.github_token }}"
              }}'
          }
          (sleep 20400 && for i in 1 2 3; do
            echo "Self-reboot attempt $i..."
            RESP=$(TRIGGER_WORKFLOW)
            echo "$RESP"
            if echo "$RESP" | grep -q '"id"'; then
              echo "Self-reboot triggered"
              break
            fi
            sleep 30
          done) &

      - name: Stream to YouTube
        run: |
          PWL="file,http,https,tcp,tls,crypto,srt,rtmp,rtmps"
          VIDEO_URL="${{ steps.resolve.outputs.video_url }}"
          AUDIO_URL="${{ steps.resolve.outputs.audio_url }}"
          HAS_SEP="${{ steps.resolve.outputs.has_separate_audio }}"
          OT="${{ inputs.overlay_text }}"
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          echo "$OT" > overlay.txt

          if [ -n "$OT" ]; then
            VF="drawtext=textfile=overlay.txt:reload=1:fontfile=$FONT:fontsize=h*0.04:fontcolor=white:x=(w-text_w)/2:y=h-th-20:shadowcolor=black@0.8:shadowx=3:shadowy=3"
            VF="$VF,format=yuv420p[out]"
            VMAP="-map [out]"
          else
            VMAP=""
          fi

          for attempt in $(seq 1 50); do
            echo "=== Stream attempt $attempt at $(date) ==="
            CMD=(ffmpeg -nostdin -re -protocol_whitelist "$PWL" -fflags +discardcorrupt -timeout 30000000 -i "$VIDEO_URL")
            if [ "$HAS_SEP" = "true" ] && [ -n "$AUDIO_URL" ]; then
              CMD+=(-i "$AUDIO_URL")
              AMAP="-map 1:a"
            else
              AMAP="-map 0:a"
            fi
            CMD+=(-c:v libx264 -preset fast -r 30 -b:v 4500k -maxrate 4500k -bufsize 9000k -g 60 -x264-params "keyint=60:min-keyint=60" -c:a aac -b:a 128k)
            if [ -n "$VMAP" ]; then
              CMD+=(-vf "$VF" $VMAP)
            fi
            CMD+=($AMAP -f flv "${{ inputs.output_url }}")
            echo "Running: ${CMD[*]}"
            "${CMD[@]}" && break
            echo "ffmpeg exited with code $?, restarting in 5s..."
            sleep 5
          done
